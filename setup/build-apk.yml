name: Build Android APK

on:
  push:
    branches: [ "arena/01a03932-language", "main" ]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK (unsigned)
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Generate signing key (debug-style, for sideloading)
        run: |
          keytool -genkeypair -v \
            -keystore hikaya.keystore \
            -alias hikaya -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hikaya123 -keypass hikaya123 \
            -dname "CN=Hikaya, OU=Reader, O=Hikaya, L=Home, C=ZA"

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk hikaya-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks hikaya.keystore --ks-key-alias hikaya \
            --ks-pass pass:hikaya123 --key-pass pass:hikaya123 \
            --out hikaya.apk hikaya-aligned.apk
          $BUILD_TOOLS/apksigner verify hikaya.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikaya-apk
          path: hikaya.apk

      - name: Publish as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Hikaya APK (latest)"
          body: |
            📱 **Hikaya — Arabic Stories** Android app.

            **Install:** download `hikaya.apk` below on your phone, open it,
            allow "install unknown apps" for your browser if asked, done.

            Built automatically from the latest code.
          files: hikaya.apk
          prerelease: false
